version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mcp-server:
    build: .
    command: python -m mcp_server.server
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - mongo

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - mcp-server

volumes:
  mongo_data:
